<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LW Intel · Tarefas</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1420;color:#edf6ff}
*{box-sizing:border-box}
body{margin:0;background:#0b1420;min-height:100vh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid #1d3042;position:sticky;top:0;background:#0b1420f5;z-index:2}
.headerText{flex:1}
h1{font-size:22px;margin:0;font-weight:800}
.muted{color:#93aabd;font-size:13px;margin-top:3px}
#refresh{width:46px;height:42px;border-radius:11px;border:1px solid #345168;background:#1c4961;color:#edf6ff;font-size:23px;font-weight:700}
.chips{display:flex;gap:7px;padding:9px 10px 3px}
.chip{flex:1;padding:9px;border-radius:10px;background:#132335;border:1px solid #273d51;color:#93aabd;font-size:11px;font-weight:800}
.chip.active{background:#245647;border-color:#68d9c0;color:#edf6ff}
#list{padding:7px 10px 30px}
.task{background:#132335;border:1px solid #273d51;border-radius:14px;padding:14px;margin:8px 0}
.task.ready{border-color:#3a806f}
.top{display:flex;align-items:center;gap:8px}
.server{color:#68d9c0;font-weight:800;font-size:16px}
.level{font-weight:800;font-size:17px}
.timer{margin-left:auto;background:#20384c;border-radius:20px;padding:5px 9px;font-size:12px;font-weight:700}
.task.ready .timer{background:#245647}
.xy{font-size:22px;font-weight:800;margin:10px 0 5px}
.meta{display:flex;justify-content:space-between;color:#a9bdcc;font-size:13px}
.empty{text-align:center;color:#93aabd;padding:40px 15px}
.err{color:#ff9b9b}
</style>
</head>
<body>
<header>
  <div class="headerText">
    <h1>✦ Tarefas externas</h1>
    <div id="summary" class="muted">Carregando…</div>
  </div>
  <button id="refresh">↻</button>
</header>

<div class="chips">
  <button class="chip active" data-filter="all">TODAS</button>
  <button class="chip" data-filter="ready">PRONTAS</button>
  <button class="chip" data-filter="soon">EM BREVE</button>
</div>

<main id="list"></main>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
